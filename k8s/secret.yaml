apiVersion: v1
kind: Secret
metadata:
  name: reference-data-aggregator-secret
  labels:
    app: reference-data-aggregator
type: Opaque
stringData:
  # Plaintext placeholders to be substituted by GitHub Actions (e.g. using envsubst)
  # Kubernetes automatically base64-encodes values under stringData on creation.
  RDAS_SOAP_USERNAME: ${RDAS_SOAP_USERNAME}
  RDAS_SOAP_PASSWORD: ${RDAS_SOAP_PASSWORD}
